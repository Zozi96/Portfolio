# Shared security headers.
#
# NOTE: `add_header` only applies at the level it is declared in nginx — a
# location block with its own `add_header` suppresses any `add_header`
# inherited from the server block. This snippet must therefore be included
# both in the `server` block AND in every `location` block that declares its
# own `add_header` directives, so the headers are always present.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://*.zozbit.com https://*.sentry.io https://*.ingest.sentry.io; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;
