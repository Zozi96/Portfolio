<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="preload"
      href="/fonts/instrument-sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/schibsted-grotesk-700.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://portfolio.zozbit.com/" />
    <link rel="alternate" hreflang="en" href="https://portfolio.zozbit.com/" />
    <link rel="alternate" hreflang="es" href="https://portfolio.zozbit.com/?lang=es" />
    <link rel="alternate" hreflang="x-default" href="https://portfolio.zozbit.com/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FBFBF9" />
    <meta name="theme-color" content="#12161E" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Senior Software Engineer specializing in distributed systems, Python, .NET, cloud architecture, and product-minded delivery for international teams."
    />
    <title>Zozimo Fernández | Senior Software Engineer</title>

    <!-- Open Graph (kept in sync with data/content.ts `seo` EN strings, which
         useDocumentMeta() re-applies at runtime once the app mounts) -->
    <meta property="og:title" content="Zozimo Fernández, Senior Software Engineer" />
    <meta
      property="og:description"
      content="I design resilient systems, data-heavy platforms, and cloud architecture that teams can actually scale."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://portfolio.zozbit.com" />
    <meta property="og:image" content="https://portfolio.zozbit.com/OpenGraph.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Zozimo Fernández, Senior Software Engineer" />
    <meta
      name="twitter:description"
      content="I design resilient systems, data-heavy platforms, and cloud architecture that teams can actually scale."
    />
    <meta name="twitter:image" content="https://portfolio.zozbit.com/OpenGraph.jpg" />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Zozimo Fernández",
        "jobTitle": "Senior Software Engineer",
        "url": "https://portfolio.zozbit.com/",
        "sameAs": ["https://github.com/Zozi96", "https://linkedin.com/in/zozi"]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
