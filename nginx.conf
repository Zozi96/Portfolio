server {
    listen 3000;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security headers (server-level) ----------
    include /etc/nginx/conf.d/nginx-security-headers.inc;

    # ---------- Brotli compression ----------
    brotli on;
    brotli_comp_level 6;
    brotli_static on;
    brotli_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/xml
        text/javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- Gzip fallback (for clients that don't support Brotli) ----------
    gzip on;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        text/xml
        text/javascript
        image/svg+xml
        font/woff
        font/woff2;

    # ---------- SPA routing ----------
    location / {
        try_files $uri /index.html;

        # HTML must not be cached (SW update prompt needs fresh fetch)
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        # add_header in a location block suppresses server-level add_header,
        # so the security headers must be re-included here too.
        include /etc/nginx/conf.d/nginx-security-headers.inc;
    }

    # ---------- Vite hashed assets – immutable, 1-year max-age ----------
    location ~* /assets/.*\.(js|css|woff|woff2|ttf|otf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        include /etc/nginx/conf.d/nginx-security-headers.inc;
    }

    # ---------- Self-hosted fonts – immutable, 1-year max-age ----------
    location ~* ^/fonts/.*\.woff2$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;

        include /etc/nginx/conf.d/nginx-security-headers.inc;
    }

    # ---------- Images and static media ----------
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;

        include /etc/nginx/conf.d/nginx-security-headers.inc;
    }

    # ---------- Health-check endpoint (Coolify / load-balancer) ----------
    location /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";

        include /etc/nginx/conf.d/nginx-security-headers.inc;
    }
}
